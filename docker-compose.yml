services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a PostgreSQL connection string}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 5
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      start_period: 40s
      retries: 5
